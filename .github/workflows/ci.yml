name: SKCUI CI

on:
  push:
    paths:
      - 'release/stable/**'
      - 'release/stable 1.x/**'
      - '.github/workflows/ci.yml'

  pull_request:
    paths:
      - 'release/stable/**'
      - 'release/stable 1.x/**'
      - '.github/workflows/ci.yml'

  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.compiler }} - ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        version: [stable, stable-1x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ clang

      - name: Select release directory
        id: release
        shell: bash
        run: |
          if [ "${{ matrix.version }}" = "stable" ]; then
            echo 'source=release/stable/examples' >> "$GITHUB_OUTPUT"
          else
            echo 'source=release/stable 1.x/examples' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc
            export CXX=g++
          else
            export CC=clang
            export CXX=clang++
          fi

          cmake -S "${{ steps.release.outputs.source }}" \
                -B build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release

      - name: Compile examples
        run: cmake --build build --parallel

      - name: Verify executable
        shell: bash
        run: |
          if [ ! -x build/skcui ]; then
            echo "::error::SKCUI executable not found or not executable."
            exit 1
          fi

          echo "Executable verified."

      - name: Run example and check stdout
        shell: bash
        run: |
          echo "Running SKCUI example..."

          set +e
          timeout 15s ./build/skcui > output.txt 2>&1
          status=$?
          set -e

          echo "Exit code: $status"
          echo "Example output:"
          cat output.txt

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "::error::Example exited unexpectedly with code $status."
            exit 1
          fi

          if [ ! -s output.txt ]; then
            echo "::error::Example produced no stdout."
            exit 1
          fi

          echo "SUCCESS: Example produced stdout."

      - name: Upload example output
        if: always() && hashFiles('output.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: skcui-output-${{ matrix.compiler }}-${{ matrix.version }}
          path: output.txt
          if-no-files-found: ignore
